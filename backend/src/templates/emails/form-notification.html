<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Form Submission</title>
  <style>
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; line-height: 1.6; color: #333; background-color: #f4f4f4; }
    .container { max-width: 600px; margin: 40px auto; background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .header { background: #0f172a; color: #ffffff; padding: 28px 30px; }
    .header h1 { margin: 0; font-size: 20px; }
    .content { padding: 30px; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    .meta { color: #64748b; font-size: 13px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>New "{{formName}}" submission</h1>
    </div>
    <div class="content">
      <p class="meta">Submitted from page: {{pageSlug}}</p>
      <table>
        {{rows}}
      </table>
    </div>
  </div>
</body>
</html>
