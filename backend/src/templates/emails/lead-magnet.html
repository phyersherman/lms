<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Download</title>
  <style>
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; line-height: 1.6; color: #333; background-color: #f4f4f4; }
    .container { max-width: 600px; margin: 40px auto; background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .header { background: #0ea5a4; color: #ffffff; padding: 28px 30px; text-align: center; }
    .header h1 { margin: 0; font-size: 20px; }
    .content { padding: 30px; text-align: center; }
    .button { display: inline-block; background: #0ea5a4; color: #ffffff !important; text-decoration: none; padding: 14px 28px; border-radius: 6px; font-weight: 600; margin: 16px 0; }
    .note { color: #64748b; font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Your download is ready</h1>
    </div>
    <div class="content">
      <p>Thanks for signing up! Click below to download <b>{{filename}}</b>.</p>
      <a class="button" href="{{downloadUrl}}">Download Now</a>
      <p class="note">This link expires in 7 days.</p>
    </div>
  </div>
</body>
</html>
