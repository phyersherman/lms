<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmation</title>
  <style>
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; line-height: 1.6; color: #333; background-color: #f4f4f4; }
    .container { max-width: 600px; margin: 40px auto; background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .header { background: #0ea5a4; color: #ffffff; padding: 28px 30px; text-align: center; }
    .header h1 { margin: 0; font-size: 20px; }
    .content { padding: 30px; }
    .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
    .note { color: #64748b; font-size: 13px; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Thank you — your order is confirmed!</h1>
    </div>
    <div class="content">
      <div class="row"><span>Item</span><b>{{productName}}</b></div>
      <div class="row"><span>Quantity</span><b>{{quantity}}</b></div>
      <div class="row"><span>Total</span><b>{{amount}}</b></div>
      <div class="row"><span>Order reference</span><b>{{orderId}}</b></div>
      <p class="note">You'll receive another update when your order ships. A full refund is available until shipment.</p>
    </div>
  </div>
</body>
</html>
