version: '3.8'

services:
  # Traefik reverse proxy with automatic SSL
  traefik:
    image: traefik:latest
    container_name: lms-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      # File provider: per-tenant customer domains, generated by the backend
      # (domainSyncService) into a shared volume and hot-reloaded by Traefik
      - "--providers.file.directory=/traefik-dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # HTTP-01 challenge works per arbitrary customer domain
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/letsencrypt
      - traefik-dynamic:/traefik-dynamic:ro
    labels:
      - "traefik.enable=true"
      # Traefik dashboard (optional, secure with auth)
      - "traefik.http.routers.traefik.rule=Host(`traefik.${BASE_DOMAIN}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=traefik-auth"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_AUTH}"
    networks:
      - lms-network

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lms_prod}
      POSTGRES_USER: ${POSTGRES_USER:-lms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms-network

  # Backend API
  backend:
    image: ghcr.io/${GITHUB_ORG}/${GITHUB_REPO}/backend:${IMAGE_TAG:-latest}
    container_name: lms-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-lms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lms_prod}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      CSRF_SECRET: ${CSRF_SECRET}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET}
      PORT: 4000
      FRONTEND_URL: https://${BASE_DOMAIN}
      # Traefik dynamic-config output for customer domains
      TRAEFIK_DYNAMIC_DIR: /traefik-dynamic
      PLATFORM_DOMAIN: ${BASE_DOMAIN}
      # Mailgun configuration
      MAILGUN_API_KEY: ${MAILGUN_API_KEY}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN}
      MAILGUN_FROM_EMAIL: ${MAILGUN_FROM_EMAIL:-noreply@${MAILGUN_DOMAIN}}
    volumes:
      - backend-certificates:/app/certificates
      - backend-fonts:/app/fonts
      - backend-uploads:/app/uploads
      - traefik-dynamic:/traefik-dynamic
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      # HTTP to HTTPS redirect
      - "traefik.http.routers.backend-http.rule=Host(`${BASE_DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend-http.entrypoints=web"
      - "traefik.http.routers.backend-http.middlewares=redirect-to-https"
      # HTTPS
      - "traefik.http.routers.backend.rule=Host(`${BASE_DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend.service=backend"
      - "traefik.http.services.backend.loadbalancer.server.port=4000"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    networks:
      - lms-network

  # Frontend Next.js app
  frontend:
    image: ghcr.io/${GITHUB_ORG}/${GITHUB_REPO}/frontend:${IMAGE_TAG:-latest}
    container_name: lms-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Same-origin API on every domain (Traefik routes /api at the edge)
      INTERNAL_API_URL: http://backend:4000
      PLATFORM_DOMAIN: ${BASE_DOMAIN}
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      # HTTP to HTTPS redirect
      - "traefik.http.routers.frontend-http.rule=Host(`${BASE_DOMAIN}`)"
      - "traefik.http.routers.frontend-http.entrypoints=web"
      - "traefik.http.routers.frontend-http.middlewares=redirect-to-https"
      # HTTPS
      - "traefik.http.routers.frontend.rule=Host(`${BASE_DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend.service=frontend"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    networks:
      - lms-network

volumes:
  postgres-data:
    driver: local
  traefik-certificates:
    driver: local
  traefik-dynamic:
    driver: local
  backend-uploads:
    driver: local
  backend-certificates:
    driver: local
  backend-fonts:
    driver: local

networks:
  lms-network:
    driver: bridge
